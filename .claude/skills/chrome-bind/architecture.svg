<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 920" font-family="Malgun Gothic, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <!-- ============================================================= -->
  <!-- chrome-bind — 크롬 아이콘 지정 = 자동화 통로 고정 (2026-07-02)  -->
  <!-- Hand-authored SVG. No external tools.                          -->
  <!-- Palette: blue=공용 '파란 창'(krs 9333) / orange=별도계정 second -->
  <!--          gray(dashed)=레거시·제외(subscription 9444 별도 SSOT)  -->
  <!--          green=SSOT(chrome_binding.yaml) / red=게이트·원칙      -->
  <!-- ============================================================= -->
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowDash" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="920" fill="#f8fafc"/>

  <!-- Title -->
  <text x="28" y="36" font-size="22" font-weight="700" fill="#0f172a">chrome-bind — 크롬 아이콘 지정 = 자동화 통로 고정</text>
  <text x="28" y="57" font-size="12.5" fill="#64748b">.lnk 아이콘 → 바인딩 SSOT(chrome_binding.yaml) → 로더 resolve() → 모든 KRS 러너가 같은 '파란 창'(CDP 9333)에 접속 — 사용자 창 = 자동화 창(OTP 시소 없음)</text>

  <!-- ===================== ① 아이콘 지정 → SSOT 등록 ===================== -->
  <text x="40" y="82" font-size="11.5" font-weight="700" fill="#334155">① 아이콘 지정(set) → 인수 주입·백업 → SSOT 등록</text>

  <!-- A. 사용자 아이콘 (.lnk) -->
  <rect x="40" y="96" width="240" height="118" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="160" y="118" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">사용자 아이콘 (.lnk)</text>
  <text x="160" y="136" font-size="10.5" fill="#7c2d12" text-anchor="middle">'거화 - Chrome' — 바탕화면</text>
  <text x="160" y="153" font-size="9.6" fill="#7c2d12" text-anchor="middle">target: chrome.exe + 포트·프로필 인수</text>
  <text x="160" y="170" font-size="9.6" fill="#7c2d12" text-anchor="middle">더블클릭 = 공용 '파란 창' 열기</text>
  <text x="160" y="192" font-size="8.8" font-style="italic" fill="#a16207" text-anchor="middle">인수 없으면 주입 (원본 백업 → .lnk.bak)</text>

  <!-- set arrow: chrome_bind.py → 아이콘 -->
  <path d="M380,150 L284,150" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="332" y="140" font-size="9.2" font-weight="700" fill="#475569" text-anchor="middle">set</text>
  <text x="332" y="166" font-size="8.4" fill="#64748b" text-anchor="middle">인수 주입·백업</text>

  <!-- B. chrome_bind.py 워커 -->
  <rect x="380" y="88" width="320" height="170" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
  <text x="540" y="110" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">chrome_bind.py — 워커</text>
  <text x="540" y="126" font-size="9.6" fill="#64748b" text-anchor="middle">독립 스크립트 · MCP 미사용 · 스킬 폴더</text>
  <rect x="396" y="134" width="140" height="30" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="466" y="153" font-size="9.8" font-weight="700" fill="#334155" text-anchor="middle">set — 등록·주입</text>
  <rect x="544" y="134" width="140" height="30" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="614" y="153" font-size="9.8" font-weight="700" fill="#334155" text-anchor="middle">status — 점검</text>
  <rect x="396" y="170" width="140" height="30" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="466" y="189" font-size="9.8" font-weight="700" fill="#334155" text-anchor="middle">launch — 기동</text>
  <rect x="544" y="170" width="140" height="30" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="614" y="189" font-size="9.8" font-weight="700" fill="#334155" text-anchor="middle">resolve — 값 출력</text>
  <text x="540" y="222" font-size="9.2" fill="#475569" text-anchor="middle">status: lnk_match · cdp_alive · device_auth 점검</text>
  <text x="540" y="240" font-size="8.8" fill="#b91c1c" text-anchor="middle">chrome.exe 아니면 not_chrome_lnk 보고·중단</text>

  <!-- write arrow: chrome_bind.py → SSOT -->
  <path d="M700,150 L776,150" stroke="#16a34a" stroke-width="1.8" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="738" y="140" font-size="9.2" font-weight="700" fill="#15803d" text-anchor="middle">write</text>
  <text x="738" y="166" font-size="8.4" fill="#16a34a" text-anchor="middle">등록/갱신</text>

  <!-- C. chrome_binding.yaml SSOT -->
  <rect x="780" y="88" width="380" height="170" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8"/>
  <text x="970" y="110" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle">chrome_binding.yaml — 바인딩 SSOT (한 장)</text>
  <text x="970" y="126" font-size="9.6" fill="#166534" text-anchor="middle">프로젝트 루트 · .gitignore(머신별·커밋 안 함)</text>
  <rect x="796" y="134" width="348" height="40" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="806" y="150" font-size="9.8" font-weight="700" fill="#1e3a8a">channel krs — port 9333 · 공용 '파란 창'</text>
  <text x="806" y="166" font-size="8.8" fill="#1e40af">shortcut(.lnk) · user_data_dir(krs_chrome_profile) · account</text>
  <rect x="796" y="180" width="348" height="28" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="806" y="198" font-size="9.8" font-weight="700" fill="#9a3412">channel second — port 9555 · 별도계정(수동 전용)</text>
  <text x="970" y="228" font-size="8.8" fill="#64748b" text-anchor="middle">subscription(9444) 채널 없음 — 별도 SSOT(우하단 회색)</text>
  <text x="970" y="246" font-size="8.8" fill="#166534" text-anchor="middle">갱신은 set 으로만 · 러너별 복제 금지</text>

  <!-- ===================== ② SSOT resolve → 로더 → 러너 ===================== -->
  <text x="340" y="286" font-size="11.5" font-weight="700" fill="#334155">② SSOT — resolve("krs") → 로더 — import → KRS 러너들</text>

  <!-- C → D resolve arrow -->
  <path d="M970,258 L970,300" stroke="#16a34a" stroke-width="1.8" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="982" y="284" font-size="9.4" font-weight="700" fill="#15803d">resolve("krs")</text>

  <!-- D. 로더 krs_watcher/chrome_binding.py -->
  <rect x="780" y="302" width="380" height="110" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="970" y="324" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">krs_watcher/chrome_binding.py — 로더</text>
  <text x="970" y="342" font-size="9.4" fill="#475569" text-anchor="middle">resolve(channel) → {port, user_data_dir, shortcut, source}</text>
  <text x="970" y="360" font-size="9.4" fill="#475569" text-anchor="middle">바인딩 파일 없으면 폴백: krs=9333 · krs_chrome_profile</text>
  <text x="970" y="376" font-size="8.8" font-style="italic" fill="#64748b" text-anchor="middle">(하위호환 — 기존 하드코딩과 동일 값)</text>
  <text x="970" y="396" font-size="9.2" fill="#b91c1c" text-anchor="middle">러너는 이 로더 import 만 — 포트/프로필 하드코딩 금지</text>

  <!-- D → E import arrow -->
  <path d="M780,357 L728,357" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="754" y="349" font-size="9.2" font-weight="700" fill="#475569" text-anchor="middle">import</text>

  <!-- E. KRS 러너들 -->
  <rect x="340" y="292" width="384" height="178" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
  <text x="532" y="314" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">KRS 자동화 러너들</text>
  <text x="532" y="330" font-size="9.2" fill="#64748b" text-anchor="middle">전부 resolve() 로 같은 창에 접속</text>
  <rect x="352" y="340" width="176" height="34" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="440" y="354" font-size="9.6" font-weight="700" fill="#334155" text-anchor="middle">rerp</text>
  <text x="440" y="368" font-size="8.4" fill="#64748b" text-anchor="middle">참여인력·카드청구</text>
  <rect x="536" y="340" width="176" height="34" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="624" y="354" font-size="9.6" font-weight="700" fill="#334155" text-anchor="middle">근태</text>
  <text x="624" y="368" font-size="8.4" fill="#64748b" text-anchor="middle">kreclass-workattendance</text>
  <rect x="352" y="380" width="176" height="34" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="440" y="394" font-size="9.6" font-weight="700" fill="#334155" text-anchor="middle">출장비</text>
  <text x="440" y="408" font-size="8.4" fill="#64748b" text-anchor="middle">kreclass-business-trip</text>
  <rect x="536" y="380" width="176" height="34" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="624" y="394" font-size="9.6" font-weight="700" fill="#334155" text-anchor="middle">일일보고</text>
  <text x="624" y="408" font-size="8.4" fill="#64748b" text-anchor="middle">kreclass-daily-report</text>
  <rect x="352" y="420" width="176" height="34" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="440" y="434" font-size="9.6" font-weight="700" fill="#334155" text-anchor="middle">ea_mcp</text>
  <text x="440" y="448" font-size="8.4" fill="#64748b" text-anchor="middle">전자결재 (krs-eclass-approval)</text>
  <rect x="536" y="420" width="176" height="34" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.1"/>
  <text x="624" y="434" font-size="9.6" font-weight="700" fill="#334155" text-anchor="middle">doccruiser</text>
  <text x="624" y="448" font-size="8.4" fill="#64748b" text-anchor="middle">공문 수집 (krs_doccruiser_fetch)</text>

  <!-- ===================== ③ 러너 → CDP 9333 → 공용 '파란 창' ===================== -->
  <path d="M532,470 L532,504" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <rect x="444" y="506" width="176" height="40" rx="8" fill="#e0edff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="532" y="524" font-size="10.6" font-weight="700" fill="#1e3a8a" text-anchor="middle">CDP 포트 9333</text>
  <text x="532" y="538" font-size="8.6" fill="#3b82f6" text-anchor="middle">DevTools browser endpoint</text>
  <path d="M532,546 L532,566" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="300" y="562" font-size="11.5" font-weight="700" fill="#1d4ed8">③ 공용 '파란 창'</text>

  <!-- F. 공용 파란 창 -->
  <rect x="300" y="568" width="470" height="150" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="535" y="592" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">공용 '파란 창' — 사용자·자동화가 같은 창</text>
  <text x="535" y="612" font-size="9.6" fill="#1e40af" text-anchor="middle">프로필 = 지갑 · KRS_ECLASS_CACHE/krs_chrome_profile</text>
  <text x="535" y="630" font-size="9.6" fill="#1e40af" text-anchor="middle">DEVICE_AUTH(기기신뢰) 보관 — 계정당 신뢰기기 1개</text>
  <text x="535" y="648" font-size="9.6" font-weight="700" fill="#1d4ed8" text-anchor="middle">로그인·OTP 세션 공유 → OTP 시소 없음</text>
  <text x="535" y="668" font-size="9.2" fill="#1e40af" text-anchor="middle">로그인은 사용자가 창에서 직접 (자격증명 미저장)</text>
  <text x="535" y="692" font-size="8.8" font-style="italic" fill="#3b82f6" text-anchor="middle">gate.krs.co.kr · eclass · hr · rnd(rERP) 전부 이 창에서</text>

  <!-- 사용자 더블클릭 → 같은 창 (아이콘에서 파란 창으로) -->
  <path d="M150,214 L150,600 C150,634 200,642 296,642" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="132" y="420" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle" transform="rotate(90 132 420)">사용자 더블클릭 — 같은 창 공유</text>

  <!-- ===================== channel second (orange, 수동 전용) ===================== -->
  <path d="M1160,196 C1198,196 1198,230 1198,300 L1198,560 C1198,586 1190,590 1164,590" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="1216" y="392" font-size="9.2" font-weight="700" fill="#ea580c" text-anchor="middle" transform="rotate(90 1216 392)">channel second — 수동 전용</text>

  <rect x="810" y="568" width="350" height="104" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.7"/>
  <text x="985" y="590" font-size="12" font-weight="700" fill="#9a3412" text-anchor="middle">second — 별도계정 '주황 창'</text>
  <text x="985" y="610" font-size="9.6" fill="#9a3412" text-anchor="middle">포트 9555 · 수동 전용 — 자동화는 붙지 않음</text>
  <text x="985" y="628" font-size="9.6" fill="#9a3412" text-anchor="middle">status 확인만 · 프로필=계정 1:1</text>
  <text x="985" y="650" font-size="9.0" font-weight="700" fill="#c2410c" text-anchor="middle">이 창에 공용 계정 로그인 금지 (교차 금지)</text>

  <!-- ===================== subscription (gray, 제외) ===================== -->
  <rect x="810" y="692" width="350" height="96" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="985" y="714" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">subscription (9444) — 이 SSOT 제외</text>
  <text x="985" y="734" font-size="9.4" fill="#64748b" text-anchor="middle">SSOT = subscription_receipt/subscriptions.yaml settings</text>
  <text x="985" y="752" font-size="9.4" fill="#64748b" text-anchor="middle">subscription-receipt 스킬 전용 프로필</text>
  <text x="985" y="772" font-size="8.8" font-style="italic" fill="#94a3b8" text-anchor="middle">이중 정의 금지 — chrome_binding.yaml 에 추가하지 않음</text>

  <!-- ===================== ④ 게이트 / 원칙 ===================== -->
  <path d="M535,718 L535,756" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowRed)"/>
  <rect x="40" y="758" width="730" height="130" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.9"/>
  <text x="405" y="782" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">④ 게이트 / 원칙</text>
  <text x="58" y="804" font-size="9.6" fill="#991b1b">· 프로필=계정 1:1 — 채널 창엔 등록 계정만 로그인 (타 계정 → DEVICE_AUTH 덮임 → OTP 시소 재발)</text>
  <text x="58" y="822" font-size="9.6" fill="#991b1b">· 비파괴 — 떠 있는 창 종료 금지 · 자격증명 저장 안 함</text>
  <text x="58" y="840" font-size="9.6" fill="#991b1b">· 러너는 resolve() 만 — 포트/프로필 하드코딩·SSOT 복제 금지 (한 장)</text>
  <text x="58" y="858" font-size="9.6" fill="#991b1b">· set 후 status 재검증(lnk_match·cdp_alive·device_auth) — 어긋남은 ⚠ 그대로 보고</text>
  <text x="58" y="876" font-size="9.6" fill="#991b1b">· .lnk 주입 전 원본 백업(.bak 최초 1회분 보존) · chrome.exe 아닌 아이콘 바인딩 금지</text>

  <!-- ===================== 범례 ===================== -->
  <rect x="810" y="428" width="350" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="824" y="448" font-size="11.4" font-weight="700" fill="#334155">범례</text>
  <rect x="824" y="458" width="18" height="13" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="850" y="469" font-size="9.8" fill="#1e3a8a">파랑 = 공용 '파란 창' (krs · 9333)</text>
  <rect x="824" y="477" width="18" height="13" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <text x="850" y="488" font-size="9.8" fill="#9a3412">주황 = 별도계정 second (9555 · 수동 전용)</text>
  <rect x="824" y="496" width="18" height="13" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="850" y="507" font-size="9.8" fill="#475569">회색(점선) = 레거시/제외 — subscription 9444 별도 SSOT</text>
  <rect x="824" y="515" width="18" height="13" rx="3" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.3"/>
  <text x="850" y="526" font-size="9.8" fill="#15803d">초록 = 바인딩 SSOT (chrome_binding.yaml)</text>
  <rect x="824" y="534" width="18" height="13" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="850" y="545" font-size="9.8" fill="#b91c1c">빨강 = 게이트·원칙 (실선=흐름 · 점선=참조/제외)</text>
</svg>
