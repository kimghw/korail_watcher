# ── chrome-bind 빈 양식(③ 양식·지침, 스킬 안) — 바인딩 SSOT chrome_binding.yaml 의 틀 ──
# 실값은 같은 스킬 폴더의 chrome_binding.yaml 에 — chrome_bind.py `set <lnk>` 가 생성·갱신.
# ⚠ 실값은 .gitignore + .toolignore 등록(커밋·toolkit 동기화 제외 — CLAUDE.md 스킬 안 실값 예외 조항). 이 양식만 커밋.
# 개념: 채널(자동화 계열) ↔ 지정 아이콘(.lnk) ↔ 포트(CDP 뒷문) ↔ 프로필(지갑 — 로그인·DEVICE_AUTH 저장).
#       프로필=계정 1:1 을 지켜야 OTP 시소가 없다(같은 계정을 두 프로필에서 번갈아 인증 금지).

channels:
  krs:                                    # KRS(eclass·rERP·HR) 자동화 채널 — 사용자와 공용 창
    shortcut: "<지정 아이콘 .lnk 전체 경로>"   # 사용자가 더블클릭하는 그 아이콘 = 자동화가 붙는 창
    port: 9333                            # CDP 포트 — 자동화 전용 뒷문(사용자는 몰라도 됨)
    user_data_dir: "<프로필 폴더 경로>"      # 지갑 — 이 폴더가 다르면 다른 창·다른 로그인
    account: "<이 창의 유일 계정>"           # ⚠ 타 계정 로그인 금지(기기신뢰 덮임 → OTP 재요구)
    set_at: "<YYYY-MM-DD>"                # 지정 일자(chrome_bind.py 가 기록)
  second:                                 # (선택) 별도 계정 수동 창 — 자동화는 붙지 않음
    shortcut: "<.lnk 경로>"
    port: 9555
    user_data_dir: "<프로필 폴더 경로>"
    account: "<별도 계정>"
    set_at: "<YYYY-MM-DD>"
# ⚠ subscription(9444·구독 수집) 채널은 여기 두지 않는다 — .claude/skills/subscription-receipt/subscriptions.yaml settings 가 SSOT.
